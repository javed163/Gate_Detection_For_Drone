# Physical gate dimensions for solvePnP
# Measure your ACTUAL competition gate carefully

gate:
  # Outer frame dimensions (meters)
  width:  1.40    # horizontal span
  height: 1.40    # vertical span

  # Inner opening (the hole the drone flies through)
  inner_width:  1.20
  inner_height: 1.20

  # The 4 corner points are defined at the OUTER corners of the gate frame
  # Origin = gate center
  # +X = right, +Y = up, Z = 0 (gate plane)
  # Order MUST match corner_extractor.py: TL, TR, BR, BL
  corners_3d:
    top_left:     [-0.70,  0.70, 0.0]
    top_right:    [ 0.70,  0.70, 0.0]
    bottom_right: [ 0.70, -0.70, 0.0]
    bottom_left:  [-0.70, -0.70, 0.0]
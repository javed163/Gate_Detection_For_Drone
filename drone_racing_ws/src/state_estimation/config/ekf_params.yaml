ekf_node:
  ros__parameters:

    # ── IMU noise parameters ──────────────────────────────────────────────
    # Get these from your IMU datasheet or Allan variance analysis
    # Units: continuous-time noise densities
    accel_noise:       0.1     # m/s² / sqrt(Hz) — typical MEMS IMU
    gyro_noise:        0.005   # rad/s / sqrt(Hz)
    accel_bias_noise:  0.001   # m/s³ / sqrt(Hz) (bias random walk)
    gyro_bias_noise:   0.0001  # rad/s² / sqrt(Hz)

    # ── Vision measurement noise ──────────────────────────────────────────
    vision_pos_noise:  0.05    # meters (1-sigma position uncertainty from solvePnP)
    vision_quat_noise: 0.05    # radians (1-sigma orientation uncertainty)

    # ── Initial state uncertainty ─────────────────────────────────────────
    init_pos_sigma:    0.1     # m
    init_vel_sigma:    0.05    # m/s
    init_att_sigma:    0.1     # rad